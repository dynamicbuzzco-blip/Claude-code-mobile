# One-click deploy on Render (https://render.com). Uses a persistent disk for the database.
services:
  - type: web
    name: barops
    runtime: node
    plan: starter
    buildCommand: "echo no build needed"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SECURE_COOKIES
        value: "1"
    disk:
      name: barops-data
      mountPath: /var/data
      sizeGB: 1
